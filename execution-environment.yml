---
version: 3
images:
  base_image:
    name: quay.io/almalinuxorg/almalinux:10@sha256:96336c2e1a61ba389a943ca68069ea803ccfabe12c4461a6e869496ddc9cad8e
dependencies:
  python_interpreter:
    package_system: python3.14
    python_path: /usr/bin/python3.14
  ansible_core:
    package_pip: ansible-core>=2.22,<2.23
  ansible_runner:
    package_pip: ansible-runner
  galaxy: |
    ---
    # Exact versions, updated by Renovate (galaxy-collection datasource)
    collections:
      # Belfry's awx.awx collection from the latest Belfry release (like awxkit
      # below), not upstream's 24.6.1 from Galaxy
      - name: https://github.com/belfry-project/belfry/releases/download/1.2.0/awx-awx-1.2.0.tar.gz
        type: url
      - name: azure.azcollection
        version: "4.2.0"
      - name: amazon.aws
        version: "12.1.0"
      - name: theforeman.foreman
        version: "6.0.0"
      - name: google.cloud
        version: "1.15.0"
      - name: openstack.cloud
        version: "2.6.0"
      - name: community.vmware
        version: "7.0.0"
      - name: ovirt.ovirt
        version: "3.2.2"
      - name: kubernetes.core
        version: "6.6.0"
      - name: ansible.posix
        version: "2.2.2"
      - name: ansible.windows
        version: "3.9.2"
      - name: redhatinsights.insights
        version: "1.3.1"
      - name: kubevirt.core
        version: "2.3.0"
  system: |
    git-core [platform:rpm]
    python3.14-devel [platform:rpm compile]
    libcurl-devel [platform:rpm compile]
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    subversion [platform:rpm]
    subversion [platform:dpkg]
    git-lfs [platform:rpm]
    sshpass [platform:rpm]
    rsync [platform:rpm]
    epel-release [platform:rpm]
    unzip [platform:rpm]
    podman-remote [platform:rpm]
    cmake [platform:rpm compile]
    gcc [platform:rpm compile]
    gcc-c++ [platform:rpm compile]
    make [platform:rpm compile]
    openssl-devel [platform:rpm compile]
  python: |
    # awxkit of the latest Belfry release (an EE release is made before the belfry release of the same version)
    https://github.com/belfry-project/belfry/releases/download/1.2.0/awxkit-1.2.0-py3-none-any.whl
    git+https://github.com/ansible/ansible-sign@f7fab0e08e79c2e665b49ac6bc377c90faa4a92b
    ncclient
    paramiko
    pykerberos
    pyOpenSSL
    pypsrp[kerberos,credssp]
    pywinrm[kerberos,credssp]
    toml
    pexpect>=4.5
    python-daemon
    pyyaml
    six
    receptorctl
    setuptools>=78.1.1  # CVE-2025-47273
additional_build_steps:
  prepend_base:
    # The AlmaLinux base image can lag behind its security updates; install them
    # AlmaLinux's mirror list sometimes hands out a mirror with broken metadata,
    # and dnf does not fall back to another mirror then: retry the refresh
    # after two failed attempts, use repo.almalinux.org instead of the mirror list
    - >-
      RUN for i in 1 2 3 4 5; do dnf -y makecache --refresh && break;
      if [ $i -eq 2 ]; then sed -i '/^mirrorlist=/{N;s|^mirrorlist=\([^\n]*\)\n# baseurl=\(https://repo\.almalinux\.org[^\n]*\)|#mirrorlist=\1\nbaseurl=\2|}' /etc/yum.repos.d/almalinux-*.repo; fi;
      dnf clean all; sleep 15; done && dnf -y upgrade && dnf clean all
  append_base:
    - RUN $PYCMD -m pip install -U pip
  append_final:
    - COPY --from=ghcr.io/belfry-project/receptor:v1.6.9-belfry.1@sha256:da242ce78920b2fb16af19499175f4f73aff75979b8983314da3aff5cffdb9ed /usr/bin/receptor /usr/bin/receptor
    - RUN mkdir -p /var/run/receptor
    - RUN git lfs install --system
    # SymLink `python` -> `python3.14`
    - RUN alternatives --install /usr/bin/python python /usr/bin/python3.14 314
