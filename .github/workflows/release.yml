---

name: Release

# Runs when a GitHub release is published (tag X.Y.Z or X.Y.Z-rc.N, no "v"):
# builds the execution environment for linux/amd64 and linux/arm64 on native
# runners and publishes ghcr.io/belfry-project/belfry-ee:<version> (and :latest
# for final releases) with provenance and SBOM attestations and a Trivy scan
# attached to the release.
#
# belfry-operator deploys belfry-ee:<version> next to belfry:<version>, so each
# Belfry release has a belfry-ee release with the same tag.
#
# Run it manually with dry_run (the default) to build everything from the
# selected branch and publish only :release-test, without touching a release.
#
# The procedure for a whole Belfry release is in RELEASING.md in
# belfry-project/.github.

on:
  release:
    types: [published]
  push:
    branches: [release-workflow]  # TEMPORARY for testing, remove before merging
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z or X.Y.Z-rc.N). Without dry run, the release with this tag must exist.'
        required: true
        default: '0.0.0-rc.0'
      dry_run:
        description: 'Dry run: publish only :release-test and no release assets'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    if: github.repository == 'belfry-project/belfry-ee'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Determine the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT}" = "release" ]; then
            version="${RELEASE_TAG}"
            dry_run=false
            prerelease="${RELEASE_PRERELEASE}"
          else
            # Manual run (or a push, while testing a branch): a dry run unless asked otherwise
            version="${INPUT_VERSION:-0.0.0-rc.0}"
            dry_run="${INPUT_DRY_RUN:-true}"
            if [ "${dry_run}" != "true" ]; then
              prerelease=$(gh release view "${version}" --json isPrerelease --jq .isPrerelease)
            fi
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Release tags are X.Y.Z or X.Y.Z-rc.N (no v prefix), got: ${version}"
            exit 1
          fi
          if [ "${dry_run}" = "true" ]; then
            ref="${GITHUB_SHA}"
            image_tag=release-test
          else
            ref="refs/tags/${version}"
            image_tag="${version}"
            # Release candidates are pre-releases, final releases are not
            if [[ "${version}" == *-rc.* ]] && [ "${prerelease}" != "true" ]; then
              echo "::error::${version} is a release candidate; mark the GitHub release as a pre-release"
              exit 1
            fi
            if [[ "${version}" != *-rc.* ]] && [ "${prerelease}" = "true" ]; then
              echo "::error::${version} is a final release; it must not be a pre-release"
              exit 1
            fi
          fi
          {
            echo "version=${version}"
            echo "ref=${ref}"
            echo "dry_run=${dry_run}"
            echo "image_tag=${image_tag}"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: Build ${{ matrix.arch.platform }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        arch:
          - {platform: linux/amd64, runner: ubuntu-latest, suffix: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/belfry-ee
      VERSION: ${{ needs.setup.outputs.version }}
      TAG: ${{ needs.setup.outputs.image_tag }}-${{ matrix.arch.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          ansible-builder create -v3 --output-file=Dockerfile
          docker buildx build \
            --platform=${{ matrix.arch.platform }} \
            --label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label=org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label=org.opencontainers.image.version="${VERSION}" \
            --label=org.opencontainers.image.description="Default execution environment for Belfry" \
            --tag "${IMAGE}:${TAG}" \
            --push \
            context

      - name: Check the image
        run: |
          docker pull -q "${IMAGE}:${TAG}"
          label=$(docker image inspect "${IMAGE}:${TAG}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "Version label: ${label}"
          if [ "${label}" != "${VERSION}" ]; then
            echo "::error::The image is labelled ${label} instead of ${VERSION}"
            exit 1
          fi
          docker run --rm "${IMAGE}:${TAG}" ansible --version
          docker run --rm "${IMAGE}:${TAG}" ansible-runner --version

  publish:
    needs: [setup, build]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: belfry-project/.github/.github/workflows/release-image.yml@release-procedure
    with:
      image: ghcr.io/belfry-project/belfry-ee
      version: ${{ needs.setup.outputs.version }}
      dry_run: ${{ needs.setup.outputs.dry_run == 'true' }}
      sources: >-
        ghcr.io/belfry-project/belfry-ee:${{ needs.setup.outputs.image_tag }}-amd64
        ghcr.io/belfry-project/belfry-ee:${{ needs.setup.outputs.image_tag }}-arm64
