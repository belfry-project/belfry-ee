---

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  podman:
    runs-on: ubuntu-latest
    name: Podman
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Build EE with Podman
        run: |
          tox -e podman

  docker:
    runs-on: ubuntu-latest
    name: Docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Build EE with Docker
        env:
          DOCKER_BUILDKIT: 1
        run: |
          tox -e docker

      # Pull requests from this repository publish their build as :pr-<number>
      # (amd64 only), so belfry CI can test it with its ee_image input.
      - name: Publish pull request image
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/belfry-ee
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag "${IMAGE}:latest" "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${TAG}"
