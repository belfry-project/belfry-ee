---

name: Publish image

on:
  push:
    branches: [main]
  schedule:
    # Nightly rebuild to pick up base image and collection updates
    - cron: '17 3 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event_name == 'release' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/belfry-ee

jobs:
  # Each architecture is built on a native runner and pushed by digest only.
  # The merge job then publishes the tags as one multi-arch image.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          ansible-builder create -v3 --output-file=Dockerfile
          docker buildx build \
            --platform=${{ matrix.platform }} \
            --label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label=org.opencontainers.image.revision=${GITHUB_SHA} \
            --label=org.opencontainers.image.description="Default execution environment for Belfry" \
            --output=type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true \
            --metadata-file=metadata.json \
            context
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          mkdir -p digests
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    name: Publish multi-arch tags
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            tag="${RELEASE_TAG}"
            echo "tags=--tag=${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            tag=main
            echo "tags=--tag=${IMAGE}:main --tag=${IMAGE}:main-${GITHUB_SHA::7} --tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            # Manual runs on other branches only publish a tag named after the branch
            tag="${GITHUB_REF_NAME//\//-}"
            echo "tags=--tag=${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push the multi-arch image
        working-directory: digests
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.tags }} \
            --annotation="index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the result
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.tag }}"
