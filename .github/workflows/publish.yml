---

name: Publish image

on:
  push:
    branches: [main]
  schedule:
    # Nightly rebuild to pick up base image and collection updates
    - cron: '17 3 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event_name == 'release' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/belfry-ee

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build and push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "tags=--tag=${IMAGE}:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=--tag=${IMAGE}:latest --tag=${IMAGE}:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        run: |
          ansible-builder create -v3 --output-file=Dockerfile
          docker buildx build \
            --push \
            --platform=linux/amd64,linux/arm64 \
            ${{ steps.tags.outputs.tags }} \
            --label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label=org.opencontainers.image.revision=${GITHUB_SHA} \
            --label=org.opencontainers.image.description="Default execution environment for Belfry" \
            context
